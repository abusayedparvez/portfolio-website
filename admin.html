<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>

<body>

<h2>Admin Login</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<p id="msg"></p>

<hr>

<h3>Create Post</h3>

<h3>Create New Post</h3>

<!-- Title -->
<input id="postTitle" placeholder="Title (e.g., New Certificate / New Video)" style="width:100%;padding:8px"><br><br>

<!-- Description -->
<textarea id="postText" placeholder="Write description..." rows="4" style="width:100%;padding:8px"></textarea><br><br>

<!-- Image Upload -->
<label>Upload Image / Certificate / Thumbnail</label><br>
<input id="postImage" type="file" accept="image/*"><br><br>

<!-- YouTube or Website Link -->
<input id="postLink" placeholder="YouTube or website link (optional)" style="width:100%;padding:8px"><br><br>

<!-- Button Text -->
<select id="postBtnText" style="padding:6px">
  <option value="">No Button</option>
  <option value="Watch">Watch</option>
  <option value="View">View</option>
  <option value="Open">Open</option>
  <option value="Download">Download</option>
</select><br><br>

<button onclick="addPost()" style="padding:10px 18px;font-size:16px;">Post Now</button>

<hr>


<script type="module">

/* ===== imports ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* ===== config ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAjF6qnDJFFLD7h4tJ10e3z4BewCeai1e8",
  authDomain: "parvez-portfolio-64cdd.firebaseapp.com",
  projectId: "parvez-portfolio-64cdd",
  storageBucket: "parvez-portfolio-64cdd.firebasestorage.app",
  messagingSenderId: "17218030818",
  appId: "1:17218030818:web:28da1deb8fcbb2396ce2bb",
  measurementId: "G-DP7E5ESRN8"
};

/* ===== init ===== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== login ===== */
window.login = function () {
  signInWithEmailAndPassword(auth, email.value, password.value)
    .then(() => msg.innerText = "Login Successful ✅")
    .catch(() => msg.innerText = "Wrong email/password ❌");
}

/* ===== post ===== */
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

const storage = getStorage(app);

window.addPost = async function () {

  let imageUrl = "";

  const file = postImage.files[0];

  if(file){
    const storageRef = ref(storage, "images/" + Date.now() + file.name);
    await uploadBytes(storageRef, file);
    imageUrl = await getDownloadURL(storageRef);
  }

  await addDoc(collection(db, "posts"), {
    title: postTitle.value,
    text: postText.value,
    image: imageUrl,
    link: postLink.value,
    btnText: postBtnText.value,
    time: Date.now()
  });

  alert("Post added!");

  postTitle.value="";
  postText.value="";
  postImage.value="";
  postLink.value="";
  postBtnText.value="";
}

</script>

</body>
</html>
