<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="admin-wrapper">

<h2>Admin Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<p id="msg"></p>

<hr>

<h3>Create New Post</h3>

<input id="postTitle" placeholder="Title">

<textarea id="postText" placeholder="Description"></textarea>

<input id="postLink" placeholder="YouTube link (optional)">

<select id="postBtnText">
  <option value="">No Button</option>
  <option>Watch</option>
  <option>View</option>
  <option>Open</option>
</select>

<button onclick="addPost()">Post Now</button>

<hr>

<h3>Your Posts</h3>
<div id="postList"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, addDoc, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAjF6qnDJFFLD7h4tJ10e3z4BewCeai1e8",
  authDomain: "parvez-portfolio-64cdd.firebaseapp.com",
  projectId: "parvez-portfolio-64cdd",
  storageBucket: "parvez-portfolio-64cdd.firebasestorage.app",
  messagingSenderId: "17218030818",
  appId: "1:17218030818:web:28da1deb8fcbb2396ce2bb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ===== LOGIN ===== */
window.login = function () {

  signInWithEmailAndPassword(auth, email.value, password.value)
    .then(() => msg.innerText = "Login Successful ✅")
    .catch(() => msg.innerText = "Wrong email/password ❌");
};


/* ===== ADD POST ===== */
window.addPost = async function () {

  await addDoc(collection(db, "posts"), {
    title: postTitle.value,
    text: postText.value,
    link: postLink.value,
    btnText: postBtnText.value,
    time: Date.now()
  });

  alert("Post added!");
};


/* ===== SHOW + DELETE ===== */
const postList = document.getElementById("postList");

onSnapshot(collection(db, "posts"), (snapshot) => {

  postList.innerHTML = "";

  snapshot.forEach((d) => {

    const data = d.data();

    postList.innerHTML += `
      <div style="margin:8px 0;">
        ${data.title || "Untitled"}
        <button onclick="deletePost('${d.id}')" class="delete-btn">Delete</button>
      </div>
    `;
  });
});

window.deletePost = async function(id){
  await deleteDoc(doc(db, "posts", id));
};

</script>

</body>
</html>
